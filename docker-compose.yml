services:
  web:
    build: .
    ports:
      - "8090:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SITE_NAME: FBVideo Downloader
      SITE_URL: http://localhost:8090
      CONTACT_EMAIL: support@your-domain.example.com
      PRIVACY_EMAIL: privacy@your-domain.example.com
      ADSENSE_ENABLED: "false"
      ADSENSE_CLIENT_ID: ""
      DOWNLOAD_RATE_LIMIT: "12"
      MEDIA_RATE_LIMIT: "20"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      # Views/downloads reporting to the Toolzen admin (values come from ./.env)
      TOOLZEN_EVENTS_URL: ${TOOLZEN_EVENTS_URL:-}
      TOOLZEN_INGEST_KEY: ${TOOLZEN_INGEST_KEY:-}
      TOOLZEN_CONNECT_TO: ${TOOLZEN_CONNECT_TO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ratelimit-cache:/var/www/html/cache/rate-limit

volumes:
  ratelimit-cache:
